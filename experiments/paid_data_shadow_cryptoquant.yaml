keep_subscription_if:
  - "Positive paired uplift on at least two crypto assets or asset/perp variants."
  - "Base and pessimistic cost results remain acceptable."
  - "Paid placebo does not perform similarly to real paid features."
  - "Timestamp and availability metadata pass the Stage B contract."

cancel_or_downgrade_if:
  - "Uplift disappears after adding free Binance derivatives/microstructure features."
  - "Results depend on one seed, one timeframe, or one asset only."
  - "Paid features mainly increase turnover without improving net performance."
  - "Provider timestamps cannot support point-in-time use."
